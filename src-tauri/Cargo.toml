[package]
name = "keydock-for-codex"
version = "1.2.4"
description = "A desktop key dock for checking and switching Codex API keys."
authors = ["Keydock contributors <keydock@example.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "keydock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# This feature is used for production builds or when a dev server is not running.
custom-protocol = ["tauri/custom-protocol"]
