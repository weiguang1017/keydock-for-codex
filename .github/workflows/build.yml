name: Build Tauri desktop app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tauri:
    name: Tauri ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: all
          - os: ubuntu-latest
            bundles: all

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Test Rust app
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri bundle
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Archive bundle artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C src-tauri/target/release/bundle -czf "artifacts/Keydock-for-Codex-${{ runner.os }}.tar.gz" .

      - name: Archive bundle artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path src-tauri\target\release\bundle\* -DestinationPath "artifacts\Keydock-for-Codex-${{ runner.os }}.zip"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Keydock-for-Codex-${{ runner.os }}
          path: artifacts/*
          if-no-files-found: error
