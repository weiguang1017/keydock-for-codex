name: Build desktop apps

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  native-macos:
    name: Native macOS app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test native app
        run: make test
      - name: Build native app
        run: make app
      - name: Package native app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Keydock for Codex.app" "Keydock-for-Codex-native-macos.zip"
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keydock-for-Codex-native-macos
          path: Keydock-for-Codex-native-macos.zip

  electron:
    name: Electron ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test Electron core
        run: npm test
      - name: Build app package
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Archive Electron app on macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/mac-"* "/tmp/Keydock-for-Codex-Electron-macOS.zip"
      - name: Archive Electron app on Linux
        if: runner.os == 'Linux'
        run: tar -C dist -czf /tmp/Keydock-for-Codex-Electron-Linux.tar.gz linux-unpacked
      - name: Archive Electron app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\\win-unpacked" -DestinationPath "$env:RUNNER_TEMP\\Keydock-for-Codex-Electron-Windows.zip"
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Keydock-for-Codex-${{ runner.os }}
          path: |
            /tmp/Keydock-for-Codex-Electron-macOS.zip
            /tmp/Keydock-for-Codex-Electron-Linux.tar.gz
            ${{ runner.temp }}/Keydock-for-Codex-Electron-Windows.zip
