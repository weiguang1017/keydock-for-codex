name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    env:
      ELECTRON_CACHE: .cache/electron
      ELECTRON_BUILDER_CACHE: .cache/electron-builder
      COPYFILE_DISABLE: 1
      CSC_IDENTITY_AUTO_DISCOVERY: false
      npm_config_audit: false
      npm_config_fund: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build macOS universal installers
        if: runner.os == 'macOS'
        run: npm run dist -- --mac --universal

      - name: Build installers
        if: runner.os != 'macOS'
        run: npm run dist

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets

          case "$RUNNER_OS" in
            macOS)
              dmg="$(find dist -maxdepth 1 -type f -name "*.dmg" | head -n 1)"
              zip="$(find dist -maxdepth 1 -type f -name "*.zip" | head -n 1)"
              test -n "$dmg"
              test -n "$zip"
              cp "$dmg" "release-assets/Keydock-for-Codex-macOS-universal.dmg"
              cp "$zip" "release-assets/Keydock-for-Codex-macOS-universal.zip"
              ;;
            Windows)
              exe="$(find dist -maxdepth 1 -type f -name "*.exe" | head -n 1)"
              zip="$(find dist -maxdepth 1 -type f -name "*.zip" | head -n 1)"
              test -n "$exe"
              test -n "$zip"
              cp "$exe" "release-assets/Keydock-for-Codex-Windows-x64.exe"
              cp "$zip" "release-assets/Keydock-for-Codex-Windows-x64.zip"
              ;;
            Linux)
              appimage="$(find dist -maxdepth 1 -type f -name "*.AppImage" | head -n 1)"
              deb="$(find dist -maxdepth 1 -type f -name "*.deb" | head -n 1)"
              test -n "$appimage"
              test -n "$deb"
              cp "$appimage" "release-assets/Keydock-for-Codex-Linux-x64.AppImage"
              cp "$deb" "release-assets/Keydock-for-Codex-Linux-x64.deb"
              ;;
          esac

          find release-assets -maxdepth 1 -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
