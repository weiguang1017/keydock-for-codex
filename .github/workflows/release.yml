name: Release Tauri desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            label: macOS-x86_64
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
            bundles: nsis msi
          - os: ubuntu-latest
            label: Linux
            target: x86_64-unknown-linux-gnu
            bundles: deb rpm appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri bundle
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" -exec cp {} artifacts/ \;

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem -Path "src-tauri\target\${{ matrix.target }}\release\bundle\nsis" -Filter "*.exe" | Copy-Item -Destination artifacts\
          Get-ChildItem -Path "src-tauri\target\${{ matrix.target }}\release\bundle\msi" -Filter "*.msi" | Copy-Item -Destination artifacts\

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/${{ matrix.target }}/release/bundle/deb -name "*.deb" -exec cp {} artifacts/ \;
          find src-tauri/target/${{ matrix.target }}/release/bundle/rpm -name "*.rpm" -exec cp {} artifacts/ \;
          find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" -exec cp {} artifacts/ \;

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
          body: |
            ## Keydock for Codex

            ### macOS
            - `*.aarch64.dmg` — Apple Silicon (M1/M2/M3/M4)
            - `*.x64.dmg` — Intel

            ### Windows
            - `*.exe` — NSIS 安装包
            - `*.msi` — MSI 安装包

            ### Linux
            - `*.deb` — Debian/Ubuntu
            - `*.rpm` — Fedora/RHEL
            - `*.AppImage` — 通用格式（免安装）
