name: Release Tauri desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis msi
          - os: ubuntu-latest
            bundles: deb rpm appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Test Rust app
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri bundle
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Archive bundle artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C src-tauri/target/release/bundle -czf "artifacts/Keydock-for-Codex-${{ runner.os }}.tar.gz" .

      - name: Archive bundle artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path src-tauri\target\release\bundle\* -DestinationPath "artifacts\Keydock-for-Codex-${{ runner.os }}.zip"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
          body: |
            Desktop installers for Keydock for Codex.

            This release is built from the Rust/Tauri app.
